# 意图地图：模块（loomina）。由 scout init 起草、Claude 按代码和 docs/ 修订，待你确认。
#  - depends_on 来自代码现状；你不希望存在的依赖，删掉后对应 import 会被拦截
#  - owns_concepts：核心业务概念只归一个模块；其他模块再定义同名符号即视为重复实现（M6）
version: 1
modules:
  - id: web
    paths: [ "apps/web/**" ]
    purpose: Next.js 应用：页面、组件、服务端路由与工作台状态；把 IR、管线和网关串成创作流程
    # 不在任何子模块里的文件（next/vitest 配置、lib/utils、fnv、config-types、request-shape）归 web.root，不受子模块依赖约束
    depends_on: [ gateway, ir, pipeline ]
    owns_concepts:
      - id: stage_flow
        symbols: [ stageStateOf, nextOpenStage, staleDownstream ]
      - id: script_doctor
        symbols: [ analyzeScript ]
      - id: compliance_preflight
        symbols: [ preflightProject, COMPLIANCE_CHECKPOINTS, scanProject ]
      - id: render_manifest
        symbols: [ buildRenderManifest, validateRenderManifest ]
      - id: subtitle_split
        symbols: [ splitSubtitleText, subtitleCues ]
      - id: platform_spec
        symbols: [ platformSpecOf, validatePlatform ]
    submodules:
      - id: logic
        # 纯计算层（无 I/O、无 store）：平台规格、AI 标识、合规规则、价目、读模型。
        # 这些模块彼此引用是正常的（合规要用平台规格，读模型要用价目）；
        # 放在同一个子模块里，才不会让 assets / models / render / review / state
        # 两两互依绕成环（M4）。
        paths: [ "apps/web/lib/platforms.ts", "apps/web/lib/platforms.test.ts", "apps/web/lib/ai-label.ts", "apps/web/lib/ai-label.test.ts", "apps/web/lib/compliance.ts", "apps/web/lib/compliance.test.ts", "apps/web/lib/pricing.ts", "apps/web/lib/pricing.test.ts", "apps/web/lib/read-model.ts", "apps/web/lib/read-model.test.ts", "apps/web/lib/cost-dashboard.ts", "apps/web/lib/cost-dashboard.test.ts", "apps/web/lib/spend-report.ts", "apps/web/lib/spend-report.test.ts", "apps/web/lib/coverage-plan.ts", "apps/web/lib/coverage-plan.test.ts", "apps/web/lib/asset-uri.ts", "apps/web/lib/asset-uri.test.ts", "apps/web/lib/moderation.ts", "apps/web/lib/moderation.test.ts", "apps/web/lib/fnv.ts", "apps/web/lib/fnv.test.ts", "apps/web/lib/asset-review.ts", "apps/web/lib/asset-review.test.ts", "apps/web/lib/rights.ts", "apps/web/lib/rights.test.ts", "apps/web/lib/storyboard.ts", "apps/web/lib/storyboard.test.ts", "apps/web/lib/performance-grammar.ts", "apps/web/lib/performance-grammar.test.ts", "apps/web/lib/beat-snap.ts", "apps/web/lib/beat-snap.test.ts", "apps/web/lib/shot-sheet.ts", "apps/web/lib/shot-sheet.test.ts", "apps/web/lib/shot-batch.ts", "apps/web/lib/shot-batch.test.ts", "apps/web/lib/reverb.ts", "apps/web/lib/reverb.test.ts", "apps/web/lib/prompt-override.ts", "apps/web/lib/prompt-override.test.ts", "apps/web/lib/model-choice.ts", "apps/web/lib/model-choice.test.ts", "apps/web/lib/metered-price.ts", "apps/web/lib/metered-price.test.ts", "apps/web/lib/project-root.ts", "apps/web/lib/server-env.ts", "apps/web/lib/server-env.test.ts", "apps/web/lib/storage-config.ts", "apps/web/lib/storage-config.test.ts" ]
        purpose: 纯计算层：平台规格、AI 标识、合规规则、价目与报价、各页读模型、资产地址解析、内容安全规则；不读盘、不调模型、不碰 store
        depends_on: [ ]
      - id: app
        paths: [ "apps/web/app/**", "apps/web/scripts/**" ]
        purpose: 页面路由与服务端 API（app/api/*）与本机 CLI 脚本；只做入参校验和转发，逻辑在 lib
        depends_on: [ assets, logic, models, panels, render, review, screens, state ]
      # 界面组件按「页面」与「抽屉 / 面板」拆两层：页面只被路由用，
      # 抽屉只被页面与工作台用，两边互不引用（已核对零交叉）。
      - id: screens
        paths: [ "apps/web/components/*-screen.tsx" ]
        purpose: 页面级界面：故事 / 剧本 / 定妆 / 分镜 / 关键帧 / 声音 / 成片 / 素材 / 设置；只被路由挂载
        depends_on: [ assets, logic, models, render, review, state, panels ]
      - id: panels
        paths: [ "apps/web/components/animatic.tsx", "apps/web/components/bilingual-panel.tsx", "apps/web/components/blocking-board.tsx", "apps/web/components/blocking-panel.tsx", "apps/web/components/brand-panel.tsx", "apps/web/components/bust.tsx", "apps/web/components/compliance-checkpoints.tsx", "apps/web/components/consistency-panel.tsx", "apps/web/components/data-section.tsx", "apps/web/components/dialogue-polish-panel.tsx", "apps/web/components/doctor-panel.tsx", "apps/web/components/elevation-board.tsx", "apps/web/components/frame-panel.tsx", "apps/web/components/gate-confirm.tsx", "apps/web/components/grade-panel.tsx", "apps/web/components/health-panel.tsx", "apps/web/components/history-panel.tsx", "apps/web/components/icons.tsx", "apps/web/components/logline-score.tsx", "apps/web/components/look-panel.tsx", "apps/web/components/model-picker.tsx", "apps/web/components/multi-platform-panel.tsx", "apps/web/components/music-curve-panel.tsx", "apps/web/components/performance-panel.tsx", "apps/web/components/performance-qa-panel.tsx", "apps/web/components/prompt-editor.tsx", "apps/web/components/prop-object.tsx", "apps/web/components/publish-ledger-panel.tsx", "apps/web/components/reel-bar.tsx", "apps/web/components/rights-panel.tsx", "apps/web/components/scene-space-panel.tsx", "apps/web/components/scene.tsx", "apps/web/components/script-version-section.tsx", "apps/web/components/series-section.tsx", "apps/web/components/shared-audio-picker.tsx", "apps/web/components/shared-entity-picker.tsx", "apps/web/components/shared-scene-picker.tsx", "apps/web/components/shared-skill-picker.tsx", "apps/web/components/shared-story-picker.tsx", "apps/web/components/shared-video-picker.tsx", "apps/web/components/shot-language-panel.tsx", "apps/web/components/shot-template-section.tsx", "apps/web/components/silent-watch-panel.tsx", "apps/web/components/spend-ledger.tsx", "apps/web/components/stage-gate.tsx", "apps/web/components/stage.tsx", "apps/web/components/story-bible-panel.tsx", "apps/web/components/storyboard-panel.tsx", "apps/web/components/structure-board.tsx", "apps/web/components/timeline-strip.tsx", "apps/web/components/top-bar.tsx", "apps/web/components/voice-performance-panel.tsx", "apps/web/components/workbench.tsx" ]
        purpose: 抽屉与面板：体检 / 走位 / 表演 / 调色 / 品牌 / 台账 / 授权等；被页面与工作台嵌入，不反向引用页面
        depends_on: [ assets, logic, models, render, review, state ]
      - id: state
        paths: [ "apps/web/lib/workbench-store.ts", "apps/web/lib/workbench-store.test.ts", "apps/web/lib/event-log.ts", "apps/web/lib/event-log.test.ts", "apps/web/lib/writer-lock.ts", "apps/web/lib/writer-lock.test.ts", "apps/web/lib/history.ts", "apps/web/lib/history.test.ts", "apps/web/lib/stage-flow.ts", "apps/web/lib/stage-flow.test.ts", "apps/web/lib/stage-lock.ts", "apps/web/lib/stage-lock.test.ts", "apps/web/lib/trash.ts", "apps/web/lib/trash.test.ts", "apps/web/lib/story-versions.ts", "apps/web/lib/story-versions.test.ts", "apps/web/lib/story-templates.ts", "apps/web/lib/story-templates.test.ts", "apps/web/lib/template-store.ts", "apps/web/lib/template-store.test.ts", "apps/web/lib/project-template.ts", "apps/web/lib/project-template.test.ts", "apps/web/lib/workspace-assets.ts", "apps/web/lib/workspace-assets.test.ts", "apps/web/lib/workspace-template.ts", "apps/web/lib/workspace-template.test.ts", "apps/web/lib/shared-entities.ts", "apps/web/lib/shared-entities.test.ts", "apps/web/lib/shared-scenes.ts", "apps/web/lib/shared-scenes.test.ts", "apps/web/lib/shared-stories.ts", "apps/web/lib/shared-stories.test.ts", "apps/web/lib/sample-project.ts", "apps/web/lib/sample-project.test.ts", "apps/web/lib/dialogue.ts", "apps/web/lib/dialogue.test.ts" , "apps/web/lib/shot-template.ts", "apps/web/lib/shot-template.test.ts", "apps/web/lib/template-edit.ts", "apps/web/lib/template-edit.test.ts", "apps/web/lib/workspace-export.ts", "apps/web/lib/workspace-export.test.ts", "apps/web/lib/workbench-helpers.ts", "apps/web/lib/workbench-helpers.test.ts", "apps/web/lib/workbench-types.ts", "apps/web/lib/workbench-actions-workspace.ts", "apps/web/lib/workbench-generate.ts", "apps/web/lib/workbench-actions-cast.ts"]
        purpose: 项目状态与持久化：工作台 store、读模型、事件日志、历史、阶段流、版本/模板/废片、跨空间复用
        depends_on: [ assets, logic, models, render, review ]
      - id: models
        paths: [ "apps/web/lib/story.ts", "apps/web/lib/story.test.ts", "apps/web/lib/app-config.ts", "apps/web/lib/app-config.test.ts", "apps/web/lib/generate-image.ts", "apps/web/lib/generate-image.test.ts", "apps/web/lib/generate-video.ts", "apps/web/lib/generate-video.test.ts", "apps/web/lib/generate-voice.ts", "apps/web/lib/generate-voice.test.ts", "apps/web/lib/transcribe-line.ts", "apps/web/lib/transcribe-line.test.ts", "apps/web/lib/instruction-ai.ts", "apps/web/lib/instruction-ai.test.ts", "apps/web/lib/instruction-run.ts", "apps/web/lib/instruction-run.test.ts", "apps/web/lib/doctor-ai.ts", "apps/web/lib/doctor-ai.test.ts", "apps/web/lib/image-price.ts", "apps/web/lib/image-price.test.ts", "apps/web/lib/doctor-run.ts", "apps/web/lib/doctor-run.test.ts", "apps/web/lib/capabilities.ts", "apps/web/lib/capabilities.test.ts", "apps/web/lib/probes.ts", "apps/web/lib/probes.test.ts", "apps/web/lib/health.ts", "apps/web/lib/health.test.ts", "apps/web/lib/health-events.ts", "apps/web/lib/health-events.test.ts", "apps/web/lib/alerts.ts", "apps/web/lib/alerts.test.ts", "apps/web/lib/long-job.ts", "apps/web/lib/long-job.test.ts" ]
        purpose: 服务端调模型：供应商/模型配置、出图/出视频/出声/识别、故事与指令与医生的模型档、能力探测与健康、长任务
        depends_on: [ assets, logic, render, review, state ]
      - id: assets
        paths: [ "apps/web/lib/asset-client.ts", "apps/web/lib/asset-client.test.ts", "apps/web/lib/asset-hydrate.ts", "apps/web/lib/asset-hydrate.test.ts", "apps/web/lib/asset-inventory.ts", "apps/web/lib/asset-inventory.test.ts", "apps/web/lib/asset-store.ts", "apps/web/lib/asset-store.test.ts", "apps/web/lib/s3-sigv4.ts", "apps/web/lib/s3-sigv4.test.ts", "apps/web/lib/s3-store.ts", "apps/web/lib/s3-store.test.ts", "apps/web/lib/storage-runtime.ts", "apps/web/lib/storage-runtime.test.ts", "apps/web/lib/log-compact.ts", "apps/web/lib/log-compact.test.ts", "apps/web/lib/data-export.ts", "apps/web/lib/data-export.test.ts" ]
        purpose: 资产库：本机/S3 存储、资产地址与回填、清点、日志压缩、数据包导出
        depends_on: [ logic, models, render ]
      - id: review
        paths: [ "apps/web/lib/director-grammar.ts", "apps/web/lib/director-grammar.test.ts", "apps/web/lib/script-doctor.ts", "apps/web/lib/script-doctor.test.ts", "apps/web/lib/consistency.ts", "apps/web/lib/consistency.test.ts", "apps/web/lib/performance-qa.ts", "apps/web/lib/performance-qa.test.ts", "apps/web/lib/silent-watch.ts", "apps/web/lib/silent-watch.test.ts", "apps/web/lib/scene-space.ts", "apps/web/lib/scene-space.test.ts", "apps/web/lib/scene-numbering.ts", "apps/web/lib/scene-numbering.test.ts", "apps/web/lib/dialogue-polish.ts", "apps/web/lib/dialogue-polish.test.ts", "apps/web/lib/hooks.ts", "apps/web/lib/hooks.test.ts", "apps/web/lib/music-curve.ts", "apps/web/lib/music-curve.test.ts", "apps/web/lib/voice-performance.ts", "apps/web/lib/voice-performance.test.ts", "apps/web/lib/rule-eval.ts", "apps/web/lib/rule-eval.test.ts", "apps/web/lib/eval-corpus.ts", "apps/web/lib/eval-corpus.test.ts" ]
        purpose: 只读诊断（不写 IR、不调模型）：分镜检查、剧本医生、覆盖率、一致性、表演 QA、静音可懂度、走位台账、台词压缩、钩子、音乐曲线、逐句表演
        depends_on: [ logic, render ]
      - id: render
        paths: [ "apps/web/lib/edit.ts", "apps/web/lib/edit.test.ts", "apps/web/lib/subtitle.ts", "apps/web/lib/subtitle.test.ts", "apps/web/lib/speaker-color.ts", "apps/web/lib/speaker-color.test.ts", "apps/web/lib/track-drag.ts", "apps/web/lib/track-drag.test.ts", "apps/web/lib/animatic-clock.ts", "apps/web/lib/animatic-clock.test.ts", "apps/web/lib/render-client.ts", "apps/web/lib/render-client.test.ts", "apps/web/lib/render-manifest.ts", "apps/web/lib/render-manifest.test.ts", "apps/web/lib/render-audio.ts", "apps/web/lib/render-audio.test.ts", "apps/web/lib/render-effects.ts", "apps/web/lib/render-effects.test.ts", "apps/web/lib/render-job-store.ts", "apps/web/lib/render-job-store.test.ts", "apps/web/lib/export-cut.ts", "apps/web/lib/export-cut.test.ts", "apps/web/lib/card-image.ts", "apps/web/lib/card-image.test.ts", "apps/web/lib/cover.ts", "apps/web/lib/cover.test.ts", "apps/web/lib/multi-platform.ts", "apps/web/lib/multi-platform.test.ts", "apps/web/lib/preview-frame.ts", "apps/web/lib/preview-frame.test.ts", "apps/web/lib/preview-proxy.ts", "apps/web/lib/preview-proxy.test.ts" ]
        purpose: 剪辑、预览与导出：时间线编辑、字幕、渲染清单与混音、转场调色、头尾卡与封面、平台规格、多平台、预览代理与找点
        depends_on: [ assets, logic, models, state ]
  - id: gateway
    paths: [ "packages/gateway/**" ]
    purpose: 模型网关：图/视频/语音/识别/文本的适配器接口、Treecloud 与 Fake 实现、价目表；业务只依赖这里的接口（P8）
    public: [ "packages/gateway/src/index.ts", "packages/gateway/src/pricing.ts" ]
    depends_on: [ ir ]
    owns_concepts:
      - id: model_adapter
        symbols: [ ImageAdapter, VideoAdapter, SpeechAdapter, ChatAdapter, VideoApiName ]
      - id: model_price
        symbols: [ videoPrice, imagePrice, videoCostCny, imageCostCny ]
  - id: ir
    paths: [ "packages/ir/**" ]
    purpose: Project IR：项目文档的唯一事实来源（ADR-0001）——schema、不变量、事件与回放
    public: [ "packages/ir/src/index.ts" ]
    depends_on: []
    owns_concepts:
      - id: project_schema
        symbols: [ ProjectSchema, assertValidProject, validateProject ]
      - id: project_events
        symbols: [ applyEvent, ProjectEvent, rebuildStates, MUST_NOT_CHANGE_MAX, MUST_NOT_CHANGE_COUNT_MAX ]
      - id: rights_record
        symbols: [ RIGHTS_KINDS, RightsRecordSchema ]
      - id: look_default
        symbols: [ DEFAULT_LOOK, LookSchema ]
      - id: cast_readiness
        symbols: [ castReadiness, missingSheetAngles, shotAnchors ]
  - id: pipeline
    paths: [ "packages/pipeline/**" ]
    purpose: 生成管线（纯函数）：故事草稿→项目、提示词编译（镜头/关键帧/视频/造型）、调度/走位、镜头语言与故事工具
    public: [ "packages/pipeline/src/index.ts" ]
    depends_on: [ gateway, ir ]
    owns_concepts:
      - id: story_draft
        symbols: [ parseStoryDraft, projectFromStoryDraft ]
      - id: prompt_compile
        symbols: [ buildVideoPrompt, buildKeyframePrompt, buildShotPrompt, compileLook ]
      - id: instruction_rules
        symbols: [ parseInstruction ]
      - id: shot_vocab
        symbols: [ SHOT_SIZE_CN, MOVE_CN ]
